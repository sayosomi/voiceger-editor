[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceger-accent-adapter"
version = "0.0.0"
description = "Japanese pronunciation and pitch-accent adapter for Voiceger"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi==0.112.1",
  "uvicorn==0.34.2",
  "soundfile==0.13.1",
]
tui = [
  "soundfile==0.13.1",
]
lab = [
  "soundfile==0.13.1",
  "pocketsphinx==5.1.1",
]

[project.scripts]
voiceger-accent-adapter = "voiceger_accent_adapter.tui:main"

[tool.setuptools.packages.find]
include = ["voiceger_accent_adapter*"]
