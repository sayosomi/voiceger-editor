[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceger-accent-adapter"
version = "0.0.0"
description = "Japanese pronunciation and pitch-accent adapter for Voiceger"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "soundfile"]

[tool.setuptools.packages.find]
include = ["voiceger_accent_adapter*"]
