[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceger-accent-adapter"
dynamic = ["version"]
description = "Pronunciation and synthesis control adapter for Voiceger"
readme = "README.md"
requires-python = "==3.9.*"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "numpy==1.23.4",
  "pydantic==2.11.4",
]

[project.optional-dependencies]
api = [
  "fastapi==0.112.1",
  "uvicorn==0.34.2",
  "soundfile==0.13.1",
]
tui = [
  "soundfile==0.13.1",
]
lab = [
  "soundfile==0.13.1",
  "pocketsphinx==5.1.1",
]

[project.urls]
Repository = "https://github.com/sayosomi/voiceger-accent-adapter"
Issues = "https://github.com/sayosomi/voiceger-accent-adapter/issues"

[project.scripts]
voiceger-accent-adapter = "voiceger_accent_adapter.entrypoint:main"

[tool.setuptools.packages.find]
include = ["voiceger_accent_adapter*"]

[tool.setuptools.dynamic]
version = {attr = "voiceger_accent_adapter._version.__version__"}
