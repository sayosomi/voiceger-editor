name: Publish release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'from pathlib import Path; namespace = {}; exec(Path("voiceger_editor/_version.py").read_text(encoding="utf-8"), namespace); print(namespace["__version__"])')"
          release_tag="${{ github.event.release.tag_name }}"
          if [[ "$release_tag" != "v$package_version" ]]; then
            echo "ERROR: release tag does not match the package version"
            echo "  tag:     $release_tag"
            echo "  version: $package_version"
            exit 1
          fi

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/voiceger-editor
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
