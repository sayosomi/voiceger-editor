name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,tui,lab]"
          # The supported Voiceger environment supplies these packages. Hosted
          # CI installs only the public dependencies needed by the unit tests.
          python -m pip install pyopenjtalk==0.4.1 httpx==0.28.1

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-startup:
    name: Windows Python 3.9 startup boundary
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install base package and smoke management commands
        run: |
          $wheels = @(Get-ChildItem "dist\*.whl")
          if ($wheels.Count -ne 1) { throw "Expected one wheel, found $($wheels.Count)" }
          $wheel = $wheels[0].FullName
          python -m venv .ci-smoke-base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $basePython = (Resolve-Path ".ci-smoke-base\Scripts\python.exe").Path
          & $basePython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $basePython -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseCli = (Resolve-Path ".ci-smoke-base\Scripts\voiceger-editor.exe").Path
          Push-Location $env:RUNNER_TEMP
          & $baseCli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $baseCli --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Install TUI extra, verify curses and run entrypoint tests
        run: |
          $wheels = @(Get-ChildItem "dist\*.whl")
          if ($wheels.Count -ne 1) { throw "Expected one wheel, found $($wheels.Count)" }
          $wheelUri = ([System.Uri]::new($wheels[0].FullName)).AbsoluteUri
          $tuiRequirement = "voiceger-editor[tui] @ $wheelUri"
          python -m venv .ci-smoke-tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tuiPython = (Resolve-Path ".ci-smoke-tui\Scripts\python.exe").Path
          & $tuiPython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $tuiPython -m pip install $tuiRequirement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $tuiPython -c "import curses; import voiceger_editor.tui"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tuiCli = (Resolve-Path ".ci-smoke-tui\Scripts\voiceger-editor.exe").Path
          Push-Location $env:RUNNER_TEMP
          & $tuiCli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $tuiCli --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location $env:GITHUB_WORKSPACE
          & $tuiPython -m unittest tests.test_entrypoint -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

  package:
    name: Build and clean-install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          print(wheels[0].resolve())
          PY
          )"
          python -m venv .ci-smoke
          .ci-smoke/bin/python -m pip install --upgrade pip
          .ci-smoke/bin/python -m pip install "voiceger-editor[api,tui,lab] @ file://$wheel"
          .ci-smoke/bin/python -m pip check
          .ci-smoke/bin/voiceger-editor --help
          .ci-smoke/bin/voiceger-editor --version

  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - unit-tests
      - windows-startup
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Check required CI results
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          WINDOWS_STARTUP_RESULT: ${{ needs.windows-startup.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          for result in "$UNIT_TESTS_RESULT" "$WINDOWS_STARTUP_RESULT" "$PACKAGE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI job did not succeed: $result"
              exit 1
            fi
          done
