name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,tui,lab]"
          # The supported Voiceger environment supplies these packages. Hosted
          # CI installs only the public dependencies needed by the unit tests.
          python -m pip install pyopenjtalk==0.4.1 httpx==0.28.1

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build and clean-install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          print(wheels[0].resolve())
          PY
          )"
          python -m venv .ci-smoke
          .ci-smoke/bin/python -m pip install --upgrade pip
          .ci-smoke/bin/python -m pip install "voiceger-editor[api,tui,lab] @ file://$wheel"
          .ci-smoke/bin/python -m pip check
          .ci-smoke/bin/voiceger-editor --help
          .ci-smoke/bin/voiceger-editor --version
